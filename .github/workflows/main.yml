
name: Build RUSHI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q RUSHI_AI_V1_Android_Project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: RUSHI_AI_Android_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload RUSHI APK
        uses: actions/upload-artifact@v4
        with:
          name: RUSHI-AI-V1-debug-apk
          path: RUSHI_AI_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

